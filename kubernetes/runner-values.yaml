# ============================================================
# GitHub Actions Runner Scale Set
# ============================================================

# GitHub repository will be provided through GITHUB_CONFIG_URL
# at deployment time.

runnerScaleSetName: "arc-runner-set"

# ============================================================
# Autoscaling
# ============================================================

# Keep one runner ready to execute jobs immediately.
minRunners: 1

# Maximum number of concurrent runners.
maxRunners: 3

# ============================================================
# Runner
# ============================================================

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command:
          - /home/runner/run.sh

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"

          limits:
            cpu: "1"
            memory: "1Gi"